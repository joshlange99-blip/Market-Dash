name: Market brief

# Builds the pre-market brief (~8:15-8:30 AM ET) and the after-close brief
# (~4:50-5:05 PM ET; ~1:50 PM on early-close days). The script works out
# whether a brief is due in Eastern time, skips NYSE holidays, and never
# publishes the same brief twice, so extra triggers are harmless.
on:
  # Preferred: an outside timer (e.g. cron-job.org) sends a "tick" every 15 min.
  repository_dispatch:
    types: [tick]
  # Backup: GitHub's own scheduler (UTC; can start late or skip under load).
  schedule:
    - cron: "7,22,37,52 12,13 * * 1-5"
    - cron: "7,22,37,52 17-23 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which brief"
        type: choice
        options: [latest, am, pm, scheduled]
        default: latest
      force:
        description: "Rebuild even if it already exists"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/market_brief.py"
      - ".github/workflows/brief.yml"

permissions:
  contents: write
  models: read

concurrency:
  group: brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser-grade HTTP client
        run: pip install --quiet curl_cffi
      - name: Build brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ github.token }}
          SITE_URL: https://joshlange99-blip.github.io/Market-Dash/
        run: |
          MODE="${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event_name == 'push' && 'latest' || 'scheduled') }}"
          # A code change rebuilds the latest brief so changes can be checked right away.
          FORCE="${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force)) && '--force' || '' }}"
          python3 scripts/market_brief.py --mode "$MODE" $FORCE
      - name: Publish
        run: |
          git add briefs
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Market brief $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

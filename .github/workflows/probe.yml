name: Probe (temporary)
on:
  push:
    branches: [main]
    paths: ["scripts/probe_jpm.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet curl_cffi && python3 scripts/probe_jpm.py
      - run: |
          mkdir -p "$RUNNER_TEMP/p" && cp probe.txt "$RUNNER_TEMP/p/" && cd "$RUNNER_TEMP/p"
          git init -q -b probe && git add probe.txt
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -q -m probe
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
